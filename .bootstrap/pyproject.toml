[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "research-knowledge-distillation-system"
version = "1.0.0"
authors = [
    {name = "Research and Knowledge Distillation System Team", email = "contact@example.com"},
]
description = "A system for progressive discovery and wisdom distillation based on the axiom 'Everything is Information, Memory, and Graph'"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "Flask==2.3.3",
    "requests==2.31.0",
    "beautifulsoup4==4.12.2",
    "networkx==3.1",
    "matplotlib==3.7.2",
    "psutil==5.9.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "black",
    "flake8",
    "mypy",
]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
]

[project.scripts]
rkds = "src.main:main"

[project.urls]
Homepage = "https://github.com/your-username/research-knowledge-distillation-system"
Repository = "https://github.com/your-username/research-knowledge-distillation-system"
Documentation = "https://github.com/your-username/research-knowledge-distillation-system#readme"